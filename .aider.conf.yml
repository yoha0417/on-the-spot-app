# .aider.conf.yml
# ---------------------------------------------------------
# 基本設定（現在の設定）
# ---------------------------------------------------------
model: openrouter/deepseek/deepseek-v4-pro
weak-model: openrouter/deepseek/deepseek-chat
# アーキテクトモード時、ファイルの書き換え作業は安価で速いモデルに任せる
editor-model: openrouter/deepseek/deepseek-v4-pro
auto-commits: true
# 自分が書きかけのファイルがあっても止まらずにコミットする
dirty-commits: true
auto-accept-architect: true

# ---------------------------------------------------------
# UI・パフォーマンス最適化（おすすめ追加）
# ---------------------------------------------------------
# ターミナルの表示を見やすくする（黒背景のターミナル用）
dark-mode: true

# プロンプトキャッシュを有効化（APIコスト節約・レスポンス高速化）
cache-prompts: true

# ---------------------------------------------------------
# 自動Lint連携（おすすめ追加）
# ---------------------------------------------------------
# AIがコードを変更した直後に自動でLintを実行
auto-lint: true

# 実行するLintコマンド（導入済みのBiomeを指定）
lint-cmd: "npx biome check --write"

# ---------------------------------------------------------
# Git連携の調整（おすすめ追加）
# ---------------------------------------------------------
# コミット履歴に「Co-authored-by: aider」を付与して人間との差分を明確化
attribute-co-authored-by: true

# ---------------------------------------------------------
# ファイル読み込み設定
# ---------------------------------------------------------
# 常に編集対象として読み込むファイル（現在の設定）
file:
  - AGENTS.md
  - README.md

# 常に「読み取り専用（ルールブック）」として読み込むファイル
read:
  - AI_RULES.md